<!DOCTYPLE html>
<html lang="en">
<head>
    <meta charset = "UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title> Linear Clock </title>
    <link rel = "stylesheet" href = "style.css">
    <script src = "script.js" defer> </script>
</head>
<body>
    <main class = "clock">
        <h1> Linear Clock </h1>

        <div id = "digital-time">00:00:00</div>

        <div class = "timeline">
            <div id = "progress"></div>
            <div id = "time-marker"></div>
        </div>

        <div class = "labels">
            <span>00:00</span>
            <span>06:00</span>
            <span>12:00</span>
            <span>18:00</span>
            <span>24:00</span>
        </div>

        <p id = "current-date"></p>
      </main>
</body>
</html>
